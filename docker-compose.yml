version: '3.8'

services:
  myrss:
    build: .
    container_name: myrss-reader
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      # 挂载数据卷，支持通过环境变量 DATA_PATH 指定宿主机绝对路径，默认使用 ./data
      - ${DATA_PATH:-./data}:/app/data
    environment:
      - PORT=8888
      - TZ=Asia/Shanghai
